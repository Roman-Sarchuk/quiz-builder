version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quiz_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: quiz_builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d quiz_builder"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: quiz_backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/quiz_builder?schema=public
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: